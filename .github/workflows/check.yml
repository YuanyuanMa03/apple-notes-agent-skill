name: Check skill package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated pinned runtime (no Notes access)
        env:
          APPLE_NOTES_AGENT_USER_HOME: ${{ github.workspace }}/artifacts/installer-home
          APPLE_NOTES_AGENT_HOME: ${{ github.workspace }}/artifacts/installer-home/.local/share/apple-notes-agent
          APPLE_NOTES_AGENT_BIN_DIR: ${{ github.workspace }}/artifacts/installer-home/.local/bin
        run: bash install.sh --target generic --no-verify
      - run: npm test
      - run: npm run check
      - run: npm run format:check
      - run: npm run pack:skill
      - uses: actions/upload-artifact@v4
        with:
          name: apple-notes-skill
          path: artifacts/apple-notes-0.1.0.skill*
